<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LONACI Loto Bonheur</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0f1117;--card:#1a1d27;--card2:#222533;--green:#00e676;--red:#ff5252;--blue:#448aff;--orange:#ffab40;--purple:#e040fb;--cyan:#18ffff;--text:#e8eaed;--text2:#9aa0a6;--border:#2d3140;--yellow:#ffd740}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* Layout */
    .container{max-width:720px;margin:0 auto;padding:16px}

    /* Header */
    header{background:linear-gradient(135deg,#1a3a1a,#0d2818);border:1px solid #2d5a2d;border-radius:14px;padding:16px 20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
    header h1{font-size:18px;color:var(--green);display:flex;align-items:center;gap:8px}
    header h1 .sub{color:var(--text2);font-size:11px;font-weight:400}
    .hdr-actions{display:flex;gap:8px;align-items:center}
    .btn{padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
    .btn-green{background:var(--green);color:#000}.btn-green:hover{background:#69f0ae}
    .btn:disabled{opacity:.5;cursor:wait}
    .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    /* Tabs */
    .tabs{display:flex;gap:2px;margin-bottom:16px;background:var(--card);border-radius:10px;padding:3px;border:1px solid var(--border)}
    .tab{flex:1;padding:10px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .2s;border:none;background:none;text-align:center}
    .tab:hover{color:var(--text)}.tab.active{background:var(--green);color:#000}

    /* Cards */
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    .card-title{font-size:14px;font-weight:700;color:var(--green);margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .card-sub{font-size:11px;color:var(--text2);margin-bottom:12px}

    /* Number balls */
    .nums{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
    .n{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
    .ns{width:32px;height:32px;font-size:13px;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .n-grn{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;box-shadow:0 3px 12px rgba(67,160,71,.35)}
    .n-red{background:linear-gradient(135deg,#c62828,#e53935);color:#fff;box-shadow:0 3px 10px rgba(229,57,53,.3)}
    .n-blu{background:linear-gradient(135deg,#1565c0,#1e88e5);color:#fff}
    .n-ora{background:linear-gradient(135deg,#ef6c00,#fb8c00);color:#fff}
    .n-pur{background:linear-gradient(135deg,#7b1fa2,#9c27b0);color:#fff}
    .n-hit{background:linear-gradient(135deg,#00c853,#69f0ae);color:#000;box-shadow:0 3px 10px rgba(0,200,83,.4)}
    .n-close{background:linear-gradient(135deg,#1565c0,#42a5f5);color:#fff}
    .n-miss{background:var(--card2);color:var(--text2);border:1px solid var(--border)}

    /* Main combo */
    .hero-combo{text-align:center;padding:24px 16px;border-color:var(--green)}
    .hero-combo .label{color:var(--green);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .hero-combo .meta{font-size:11px;color:var(--text2);margin-top:10px}

    /* Pair chip */
    .pair-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);padding:8px 14px;border-radius:10px}
    .pair-chip .sep{color:var(--text2);font-size:16px}
    .pair-chip .votes{color:var(--text2);font-size:10px;margin-left:4px}

    /* Tirage row */
    .trow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
    .trow:last-child{border-bottom:none}
    .trow-time{background:var(--card2);padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;color:var(--cyan);min-width:42px;text-align:center}
    .trow-name{font-weight:600;font-size:12px;min-width:110px}
    .trow .nums{gap:3px;justify-content:flex-start}

    /* Jour select */
    .jsel{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
    .jbtn{padding:7px 12px;border-radius:7px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:11px;font-weight:500;cursor:pointer;transition:all .2s}
    .jbtn:hover{border-color:var(--green);color:var(--green)}
    .jbtn.active{background:var(--green);color:#000;border-color:var(--green);font-weight:700}

    /* Week cards */
    .wday{background:var(--card2);border-radius:8px;padding:12px;text-align:center;min-width:90px;flex:1}
    .wday.today{border:2px solid var(--green)}
    .wday .d-name{font-size:10px;color:var(--text2)}
    .wday .d-date{font-size:15px;font-weight:700;margin:2px 0}
    .wday .d-perf{font-size:14px;font-weight:800}

    /* Stats */
    .stat-box{background:var(--card2);border-radius:8px;padding:14px;text-align:center;flex:1;min-width:100px}
    .stat-box .val{font-size:28px;font-weight:800}
    .stat-box .lbl{font-size:10px;color:var(--text2);margin-top:2px}
    .cat-chip{border-radius:8px;padding:10px 14px;text-align:center;flex:1;min-width:80px}
    .cat-chip .cat-name{font-size:10px;font-weight:700;text-transform:uppercase}
    .cat-chip .cat-val{font-size:20px;font-weight:800}
    .cat-chip .cat-sub{font-size:9px;color:var(--text2)}

    /* Chart */
    .chart-wrap{overflow-x:auto;margin:8px 0}

    /* Compare blocks */
    .cmp-block{background:var(--card2);border-radius:8px;padding:12px;margin-bottom:8px}
    .cmp-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
    .cmp-header .date{font-weight:700;font-size:12px}.cmp-header .tirage{color:var(--text2);font-size:11px}
    .cmp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0}
    .cmp-row .lbl{font-size:10px;color:var(--text2);min-width:60px}
    .cmp-result{font-size:11px;margin-left:auto;white-space:nowrap}
    .cmp-result .g{color:var(--green);font-weight:700}.cmp-result .p{color:var(--blue)}

    /* Collapsible */
    .collapse-btn{display:flex;justify-content:space-between;align-items:center;cursor:pointer;width:100%}
    .collapse-btn .arrow{color:var(--text2);font-size:16px;transition:transform .2s}
    .collapse-content{display:none;margin-top:10px}
    .collapse-content.open{display:block}

    /* Sidebar */
    .sidebar{position:fixed;right:0;top:0;width:260px;height:100vh;background:var(--card);border-left:1px solid var(--border);overflow-y:auto;padding:14px;z-index:100}
    .sidebar h3{font-size:12px;color:var(--green);margin-bottom:8px}
    .sid-date{font-size:10px;color:var(--text2);font-weight:400}
    .sid-draw{padding:6px 0;border-bottom:1px solid var(--border)}.sid-draw:last-child{border-bottom:none}
    .sid-draw-name{font-size:11px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:5px}
    .sid-draw-name .h{font-size:9px;color:var(--cyan);font-weight:700}
    .sid-nums{display:flex;gap:3px;flex-wrap:wrap}
    .sid-n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
    .sid-g{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff}
    .sid-m{background:var(--card2);color:var(--orange);border:1px solid var(--orange)}
    .sid-empty{text-align:center;color:var(--text2);font-size:11px;padding:20px 0}
    .sid-count{background:var(--card2);padding:6px;border-radius:6px;margin-bottom:8px;text-align:center;font-size:11px;color:var(--text2)}
    .sid-count b{color:var(--green);font-size:14px}
    .sid-refresh{width:100%;padding:6px;border:none;border-radius:6px;background:var(--card2);color:var(--green);font-size:10px;font-weight:600;cursor:pointer;margin-top:6px}

    /* Page */
    .page{display:none}.page.active{display:block}

    /* Loading */
    .loading{text-align:center;padding:40px;color:var(--text2)}
    .spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Toast */
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--green);color:var(--green);padding:10px 20px;border-radius:8px;font-size:12px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s}
    .toast.show{opacity:1}

    @media(min-width:1000px){.container{margin-right:270px}}
    @media(max-width:999px){.sidebar{display:none}}
    @media(max-width:520px){
      .container{padding:8px}
      header{padding:12px;border-radius:10px;margin-bottom:10px}
      header h1{font-size:15px}
      .tab{padding:8px 4px;font-size:12px}
      .card{padding:12px;margin-bottom:10px}
      .n{width:40px;height:40px;font-size:16px}
      .ns{width:28px;height:28px;font-size:11px}
      .hero-combo{padding:16px 10px}
      .trow{gap:5px;flex-wrap:wrap}
      .trow-name{min-width:auto;font-size:11px}
      .stat-box .val{font-size:22px}
      .wday{min-width:70px;padding:8px}
      .wday .d-date{font-size:13px}
      .jsel{gap:3px}.jbtn{padding:5px 8px;font-size:10px}
    }
  </style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <h3>Resultats du jour <span class="sid-date" id="sidDate"></span></h3>
  <div id="sidContent"><div class="sid-empty">Chargement...</div></div>
  <button class="sid-refresh" onclick="loadSidebar()">Rafraichir</button>
</div>

<div class="container">
  <header>
    <h1>Loto Bonheur <span class="sub" id="dbStatus">...</span></h1>
    <div class="hdr-actions">
      <span class="live-dot"></span>
      <span style="font-size:10px;color:var(--text2)" id="statusTime"></span>
      <button class="btn btn-green" id="btnUpdate" onclick="actualiser()">Actualiser</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-page="jouer" onclick="showPage('jouer')">Jouer</button>
    <button class="tab" data-page="semaine" onclick="showPage('semaine')">Semaine</button>
    <button class="tab" data-page="suivi" onclick="showPage('suivi')">Suivi</button>
    <button class="tab" data-page="backtest" onclick="showPage('backtest')">Backtest</button>
  </div>

  <div class="page active" id="page-jouer">
    <div class="jsel" id="jourSelect"></div>
    <div id="jouerContent"><div class="loading"><div class="spinner"></div></div></div>
  </div>
  <div class="page" id="page-semaine">
    <div id="semaineContent"><div class="loading"><div class="spinner"></div></div></div>
  </div>
  <div class="page" id="page-suivi">
    <div id="suiviContent"><div class="loading"><div class="spinner"></div></div></div>
  </div>
  <div class="page" id="page-backtest">
    <div id="backtestContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var JOURS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
var currentJour=new Date().getDay();

function showPage(id){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.getElementById('page-'+id).classList.add('active');
  document.querySelector('[data-page="'+id+'"]').classList.add('active');
  if(id==='jouer')loadJouer(currentJour);
  else if(id==='semaine')loadSemaine();
  else if(id==='suivi')loadSuivi();
  else if(id==='backtest')loadBacktest();
}

function N(n,cls){return '<div class="n '+cls+'">'+String(n).padStart(2,'0')+'</div>'}
function Ns(n,cls){return '<div class="ns '+cls+'">'+String(n).padStart(2,'0')+'</div>'}

function buildJourSelect(cur,cb){
  var c=document.getElementById('jourSelect');c.innerHTML='';
  for(var i=0;i<7;i++){
    var d=new Date();d.setDate(d.getDate()+i);
    var j=d.getDay();
    var label=i===0?"Aujourd'hui":i===1?"Demain":JOURS[j];
    var ds=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
    var b=document.createElement('button');
    b.className='jbtn'+(j===cur?' active':'');
    b.textContent=label+' '+ds;
    b.setAttribute('data-jour',j);
    b.onclick=function(){
      var jj=parseInt(this.getAttribute('data-jour'));
      c.querySelectorAll('.jbtn').forEach(function(x){x.classList.remove('active')});
      this.classList.add('active');
      cb(jj);
    };
    c.appendChild(b);
  }
}

function perfColor(pct){return pct>=6.5?'var(--green)':pct>=5.5?'var(--orange)':'var(--red)'}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},3000);
}

function toggleCollapse(id){
  var el=document.getElementById(id);
  var arrow=document.getElementById('arrow-'+id);
  var open=el.classList.toggle('open');
  arrow.textContent=open?String.fromCharCode(8722):'+';
}

// ═══ HEADER ═══
function loadStatus(){
  fetch('/api/status').then(function(r){return r.json()}).then(function(r){
    document.getElementById('dbStatus').textContent=(r.nbTirages||0).toLocaleString()+' tirages';
    var d=r.lastUpdate?new Date(r.lastUpdate):null;
    document.getElementById('statusTime').textContent=d?d.toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit'}):'';
  }).catch(function(){document.getElementById('dbStatus').textContent='Hors ligne'});
}

function actualiser(){
  var b=document.getElementById('btnUpdate');
  b.disabled=true;b.textContent='...';
  fetch('/api/compare-now',{method:'POST'}).then(function(r){return r.json()}).then(function(r){
    b.disabled=false;b.textContent='Actualiser';
    if(r.success){
      showToast(r.newDraws>0?'+'+r.newDraws+' nouveaux resultats':'Deja a jour');
      loadStatus();loadSidebar();
      showPage(document.querySelector('.tab.active').dataset.page);
    }
  }).catch(function(){b.disabled=false;b.textContent='Actualiser';showToast('Erreur connexion')});
}

// ═══ PAGE: JOUER ═══
function loadJouer(jour){
  currentJour=jour;
  buildJourSelect(jour,loadJouer);
  var el=document.getElementById('jouerContent');
  el.innerHTML='<div class="loading"><div class="spinner"></div></div>';

  Promise.all([
    fetch('/api/predictions/'+jour).then(function(r){return r.json()}),
    fetch('/api/paires/'+jour).then(function(r){return r.json()}).catch(function(){return null})
  ]).then(function(results){
    var data=results[0],pData=results[1];
    if(data.error){el.innerHTML='<div class="card">'+data.error+'</div>';return}

    var h='';
    var superC=null,neuralC=null,otherC=[];
    for(var i=0;i<data.global.combos.length;i++){
      var c=data.global.combos[i];
      if(c.isSuper||c.confiance==='MAXIMALE'){superC=c}
      else if(c.isNeural||c.confiance==='IA'){neuralC=c}
      else{otherC.push(c)}
    }

    // CONSEIL DU JOUR
    // Donnees basees sur backtest Chance 4+ DC, 6 mois, Bot top 4
    var jourQuality={0:{lbl:'TRES BON',col:'var(--green)',icon:'&#9733;'},1:{lbl:'BON',col:'var(--orange)',icon:'&#9733;'},2:{lbl:'JACKPOT',col:'var(--green)',icon:'&#9733;&#9733;&#9733;'},3:{lbl:'FAIBLE',col:'var(--red)',icon:'&#9888;'},4:{lbl:'NEUTRE',col:'var(--orange)',icon:''},5:{lbl:'BON',col:'var(--green)',icon:'&#9733;'},6:{lbl:'BON',col:'var(--green)',icon:'&#9733;'}};
    var topTirages={0:['Prestige','Benediction','Digital Reveil 7h'],1:['Reveil','Cash','Digital 23h'],2:['Sika','Digital Reveil 8h','Digital 23h'],3:['Baraka','Digital Reveil 7h','Digital 23h'],4:['Digital Reveil 8h','Digital 23h','Digital 21h'],5:['Digital Reveil 7h','Digital 23h','Afterwork'],6:['Special Weekend 3h','Diamant','Digital 23h']};
    var eviterTirages={0:['Espoir','National'],1:['Monday Special','Premiere Heure'],2:['Lucky Tuesday','Emergence'],3:['Midweek','Premiere Heure'],4:['Kado','Fortune Thursday'],5:['Friday Bonanza','Solution'],6:['National','Moaye']};
    // Remarques speciales par tirage
    var tirageRemarks={'Sika':'MEILLEUR TIRAGE (ROI +19246%) — 1 jackpot 4/4 sur 6 mois','Digital Reveil 8h':'Top digital (ROI +222%, 11.3% de win)','Digital Reveil 7h':'Solide (ROI +159%)','Digital 23h':'Regulier tous les jours (ROI +120%)','Special Weekend 3h':'Bon le weekend (ROI +289%)','Reveil':'Surprise lundi matin (ROI +622%)','Cash':'Vendredi matin rentable (ROI +535%)','Monday Special':'EVITER — 0 gain en 6 mois','Lucky Tuesday':'EVITER — 0 gain en 6 mois','Midweek':'EVITER — 0 gain en 6 mois','Friday Bonanza':'EVITER — quasi-perdant','Espoir':'EVITER — 0 gain','National':'EVITER — 0 gain'};
    var jq=jourQuality[jour]||{lbl:'',col:'var(--text2)',icon:''};
    var tops=topTirages[jour]||[];
    var eviter=eviterTirages[jour]||[];

    h+='<div class="card" style="border-color:'+jq.col+';background:linear-gradient(135deg,rgba(0,0,0,0),rgba(0,0,0,.2))">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    h+='<div class="card-title" style="margin:0;color:'+jq.col+'">'+jq.icon+' '+JOURS[jour]+' : '+jq.lbl+'</div>';
    h+='</div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;font-size:11px">';
    // Pari recommande
    h+='<div style="background:var(--card2);padding:8px 12px;border-radius:6px;flex:1;min-width:140px">';
    h+='<div style="color:var(--cyan);font-weight:700;font-size:10px;margin-bottom:3px">PARI RECOMMANDE</div>';
    h+='<div style="color:var(--text);font-weight:600">Chance 4+ Double Chance</div>';
    h+='<div style="color:var(--text2);font-size:9px">4 nums, gagne a 2+ bons (gagnants+machine)</div>';
    h+='<div style="color:var(--yellow);font-size:9px;margin-top:2px">ROI +951% sur 6 mois de backtest</div>';
    h+='</div>';
    // Tirages a cibler
    if(tops.length>0){
      h+='<div style="background:var(--card2);padding:8px 12px;border-radius:6px;flex:1;min-width:140px">';
      h+='<div style="color:var(--green);font-weight:700;font-size:10px;margin-bottom:3px">A CIBLER</div>';
      h+='<div style="color:var(--text)">'+tops.join(', ')+'</div>';
      h+='</div>';
    }
    // Tirages a eviter
    if(eviter.length>0){
      h+='<div style="background:var(--card2);padding:8px 12px;border-radius:6px;flex:1;min-width:140px">';
      h+='<div style="color:var(--red);font-weight:700;font-size:10px;margin-bottom:3px">EVITER</div>';
      h+='<div style="color:var(--text2)">'+eviter.join(', ')+'</div>';
      h+='</div>';
    }
    h+='</div>';
    // Mini-guide mises
    h+='<div style="margin-top:8px;padding:8px 12px;background:rgba(68,138,255,.06);border:1px solid rgba(68,138,255,.15);border-radius:6px;font-size:10px;color:var(--text2)">';
    if(jq.lbl==='EXCELLENT'||jq.lbl==='TRES BON'){
      h+='<b style="color:var(--blue)">Conseil :</b> Bon jour. <b style="color:var(--text)">Chance 4+ Double Chance</b> : prends les <b>4 premiers numeros</b> Bot + 4 premiers IA. Mise 100F chaque = 200F/tirage.';
    }else if(jq.lbl==='BON'||jq.lbl==='NEUTRE'){
      h+='<b style="color:var(--blue)">Conseil :</b> Jour moyen. <b style="color:var(--text)">Chance 4+ DC</b> Bot seul (100F) sur les tirages recommandes.';
    }else{
      h+='<b style="color:var(--blue)">Conseil :</b> Jour faible. <b style="color:var(--text)">Evite</b> ou 100F sur Digital 23h en Chance 4+ DC.';
    }
    h+='</div>';
    h+='</div>';

    // COMBO FUSION — la seule mise recommandee
    if(superC){
      // Detecter les numeros en commun (classique + IA)
      var cNums=superC.classicTop5||[];
      var nNums=superC.nnTop5||[];
      var common=superC.commonNums||[];

      h+='<div class="card hero-combo">';
      h+='<div class="label">&#127919; A jouer — Combo Fusion</div>';
      h+='<div style="font-size:10px;color:var(--text2);margin-bottom:8px">Les 5 meilleurs numeros (classique + IA combines)</div>';
      h+='<div class="nums" style="gap:10px;margin:12px 0">';
      for(var i=0;i<superC.nums.length;i++){
        var isCommon=common.indexOf(superC.nums[i])>=0;
        var isNN=nNums.indexOf(superC.nums[i])>=0&&cNums.indexOf(superC.nums[i])<0;
        h+=N(superC.nums[i],isCommon?'n-hit':isNN?'n-pur':'n-grn');
      }
      h+='</div>';
      h+='<div class="meta">Somme: '+superC.nums.reduce(function(a,b){return a+b},0)+' &middot; '+JOURS[jour]+'</div>';
      if(common.length>0){
        h+='<div style="margin-top:6px;font-size:10px;color:var(--yellow)">&#9733; '+common.length+' numero'+(common.length>1?'s':'')+' en commun classique + IA = confiance max</div>';
      }
      h+='</div>';

      // DETAIL: d'ou viennent les numeros
      h+='<div class="card" style="padding:12px">';
      h+='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">';
      // Classique
      h+='<div style="flex:1;min-width:140px;text-align:center">';
      h+='<div style="font-size:10px;color:var(--green);font-weight:700;margin-bottom:4px">CLASSIQUE</div>';
      h+='<div class="nums" style="gap:4px;justify-content:center">';
      for(var i=0;i<cNums.length;i++) h+=Ns(cNums[i],'n-grn ns');
      h+='</div></div>';
      // VS
      h+='<div style="color:var(--text2);font-size:12px;font-weight:700">+</div>';
      // IA
      h+='<div style="flex:1;min-width:140px;text-align:center">';
      h+='<div style="font-size:10px;color:var(--purple);font-weight:700;margin-bottom:4px">IA NEURAL</div>';
      h+='<div class="nums" style="gap:4px;justify-content:center">';
      for(var i=0;i<nNums.length;i++) h+=Ns(nNums[i],'n-pur ns');
      h+='</div></div>';
      // = Fusion
      h+='<div style="color:var(--text2);font-size:12px;font-weight:700">=</div>';
      h+='<div style="flex:1;min-width:140px;text-align:center">';
      h+='<div style="font-size:10px;color:var(--cyan);font-weight:700;margin-bottom:4px">FUSION</div>';
      h+='<div class="nums" style="gap:4px;justify-content:center">';
      for(var i=0;i<superC.nums.length;i++) h+=Ns(superC.nums[i],'n-grn ns');
      h+='</div></div>';
      h+='</div>';
      // Conseil Double Chance
      h+='<div style="margin-top:10px;padding:8px 10px;background:rgba(255,171,64,.06);border:1px solid rgba(255,171,64,.2);border-radius:6px;font-size:10px;color:var(--text)">';
      h+='<b style="color:var(--orange)">&#128161; Double Chance :</b> Si ton tirage a des numeros machine, joue en <b>Double Chance</b> — tes numeros sont compares aux gagnants ET aux numeros machine (10 cibles au lieu de 5). Tes chances doublent !';
      h+='</div>';
      h+='</div>';
    }

    // PAIRES
    if(pData&&(pData.superPaire1||pData.superPaire2)){
      h+='<div class="card"><div class="card-title">Paires du jour</div>';
      h+='<div class="card-sub">Numeros qui sortent souvent ensemble</div>';
      h+='<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">';
      if(pData.superPaire1){
        h+='<div class="pair-chip">'+Ns(pData.superPaire1.a,'n-red ns')+'<span class="sep">+</span>'+Ns(pData.superPaire1.b,'n-red ns')+'<span class="votes">'+pData.superPaire1.votes+' fois</span></div>';
      }
      if(pData.superPaire2){
        h+='<div class="pair-chip">'+Ns(pData.superPaire2.a,'n-pur ns')+'<span class="sep">+</span>'+Ns(pData.superPaire2.b,'n-pur ns')+'<span class="votes">'+pData.superPaire2.votes+' fois</span></div>';
      }
      h+='</div></div>';
    }

    // TIRAGES DU JOUR
    h+='<div class="card"><div class="card-title">Tirages du '+JOURS[jour]+'</div>';
    h+='<div class="card-sub"><span style="color:var(--green)">&#9679;</span> Bot &nbsp; <span style="color:var(--purple)">&#9679;</span> IA &nbsp; <span style="color:var(--orange)">&#9679;</span> LSTM &nbsp; <span style="color:var(--cyan)">&#9679;</span> Vote &nbsp; <span style="color:var(--text2)">&#9679;</span> 5e choix</div>';
    for(var i=0;i<data.parTirage.length;i++){
      var t=data.parTirage[i];
      if(!t.prediction)continue;
      var sc=null,nnC=null,lstmC=null,mainC=t.prediction.combos[0];
      for(var j=0;j<t.prediction.combos.length;j++){
        if(t.prediction.combos[j].isSuper||t.prediction.combos[j].confiance==='MAXIMALE'){sc=t.prediction.combos[j];mainC=sc}
        if(t.prediction.combos[j].isNeural||t.prediction.combos[j].confiance==='IA'){nnC=t.prediction.combos[j]}
        if(t.prediction.combos[j].isLSTM||t.prediction.combos[j].confiance==='LSTM'){lstmC=t.prediction.combos[j]}
      }
      var remark=tirageRemarks[t.tirage]||'';
      var isTop=tops.indexOf(t.tirage)>=0;
      var isEviter=eviter.indexOf(t.tirage)>=0;
      var borderCol=isEviter?'var(--red)':isTop?'var(--green)':'var(--border)';
      var nnNums=nnC?nnC.nums:[];
      var lstmNums=lstmC?lstmC.nums:[];
      var botNums=mainC.nums;
      function countVotes(n){var v=0;if(botNums.indexOf(n)>=0)v++;if(nnNums.indexOf(n)>=0)v++;if(lstmNums.indexOf(n)>=0)v++;return v}
      var totalVotes=0;
      for(var v=0;v<botNums.length;v++){if(countVotes(botNums[v])>=2)totalVotes++}
      h+='<div style="padding:8px 0;border-bottom:1px solid var(--border);border-left:3px solid '+borderCol+';padding-left:8px;margin-bottom:2px;border-radius:2px">';
      // Ligne Bot — vote si present dans 2+ sources
      h+='<div class="trow" style="border:none;padding:2px 0">';
      h+='<span class="trow-time">'+t.heure+'</span>';
      h+='<span class="trow-name"'+(isTop?' style="color:var(--green)"':'')+(isEviter?' style="color:var(--red)"':'')+'>'+t.tirage+'</span>';
      h+='<div class="nums" style="gap:3px;justify-content:flex-start">';
      for(var k=0;k<botNums.length;k++){
        var nv=countVotes(botNums[k]);
        var cls=nv>=2?'n-hit':(k<4?(sc?'n-grn':'n-blu'):'n-miss');
        h+=Ns(botNums[k],cls+' ns');
      }
      h+='</div>';
      if(totalVotes>0) h+='<span style="font-size:8px;color:var(--cyan);font-weight:700;margin-left:4px">'+totalVotes+'&#9733;</span>';
      if(isTop) h+='<span style="font-size:8px;color:var(--green);font-weight:700;margin-left:4px">TOP</span>';
      if(isEviter) h+='<span style="font-size:8px;color:var(--red);font-weight:700;margin-left:4px">EVITER</span>';
      h+='</div>';
      // Ligne IA Neural
      if(nnC){
        h+='<div class="trow" style="border:none;padding:2px 0;padding-left:50px">';
        h+='<span style="font-size:9px;color:var(--purple);font-weight:700;min-width:110px">IA</span>';
        h+='<div class="nums" style="gap:3px;justify-content:flex-start">';
        for(var k=0;k<nnC.nums.length;k++){
          var nv=countVotes(nnC.nums[k]);
          var cls=nv>=2?'n-hit':(k<4?'n-pur':'n-miss');
          h+=Ns(nnC.nums[k],cls+' ns');
        }
        h+='</div></div>';
      }
      // Ligne LSTM
      if(lstmC){
        h+='<div class="trow" style="border:none;padding:2px 0;padding-left:50px">';
        h+='<span style="font-size:9px;color:var(--orange);font-weight:700;min-width:110px">LSTM</span>';
        h+='<div class="nums" style="gap:3px;justify-content:flex-start">';
        for(var k=0;k<lstmC.nums.length;k++){
          var nv=countVotes(lstmC.nums[k]);
          var cls=nv>=2?'n-hit':(k<4?'n-ora':'n-miss');
          h+=Ns(lstmC.nums[k],cls+' ns');
        }
        h+='</div></div>';
      }
      // Remarque speciale
      if(remark){
        var rkCol=remark.indexOf('EVITER')>=0?'var(--red)':remark.indexOf('JACKPOT')>=0||remark.indexOf('MEILLEUR')>=0?'var(--yellow)':'var(--text2)';
        h+='<div style="font-size:9px;color:'+rkCol+';padding-left:50px;margin-top:1px">'+remark+'</div>';
      }
      h+='</div>';
    }
    h+='</div>';

    // AUTRES STRATEGIES
    if(otherC.length>0){
      h+='<div class="card" style="padding-bottom:8px">';
      h+='<div class="collapse-btn" onclick="toggleCollapse(\'moreStrats\')">';
      h+='<div class="card-title" style="margin:0">Autres combinaisons ('+otherC.length+')</div>';
      h+='<span class="arrow" id="arrow-moreStrats">+</span></div>';
      h+='<div class="collapse-content" id="moreStrats">';
      for(var i=0;i<otherC.length;i++){
        var c=otherC[i];
        h+='<div class="trow"><span class="trow-name" style="color:var(--text2)">'+c.nom+'</span><div class="nums" style="gap:3px;justify-content:flex-start">';
        for(var k=0;k<c.nums.length;k++) h+=Ns(c.nums[k],'n-blu ns');
        h+='</div></div>';
      }
      h+='</div></div>';
    }

    // SAUVEGARDER
    h+='<div style="text-align:center;margin:16px 0"><button class="btn btn-green" style="padding:12px 32px;font-size:14px" onclick="savePredictions('+jour+')">Sauvegarder mes numeros</button></div>';

    el.innerHTML=h;
    window._lastPredData=data;

  }).catch(function(){el.innerHTML='<div class="card" style="color:var(--red)">Erreur de connexion</div>'});
}

function savePredictions(jour){
  if(!window._lastPredData)return;
  var now=new Date();var ds=now.toLocaleDateString('fr-FR');
  var preds=[];
  for(var i=0;i<window._lastPredData.parTirage.length;i++){
    var t=window._lastPredData.parTirage[i];
    if(t.prediction)preds.push({date:ds,tirage:t.tirage,heure:t.heure,nums:t.prediction.combos[0].nums});
  }
  fetch('/api/save-predictions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({predictions:preds})}).then(function(r){return r.json()}).then(function(r){
    if(r.success) showToast(r.saved+' predictions sauvegardees');
  });
}

// ═══ PAGE: SUIVI ═══
function loadSuivi(){
  var el=document.getElementById('suiviContent');
  el.innerHTML='<div class="loading"><div class="spinner"></div></div>';

  Promise.all([
    fetch('/api/historique').then(function(r){return r.json()}),
    fetch('/api/performance').then(function(r){return r.json()}).catch(function(){return null})
  ]).then(function(results){
    var hist=results[0],perf=results[1];
    var h='';
    var pctExact=hist.stats.totalPredictions>0?(hist.stats.totalExacts/hist.stats.totalPredictions*100).toFixed(1):'0';
    var hasard='5.6';

    // STATS PRINCIPALES
    h+='<div class="card"><div class="card-title">Resultats du bot</div>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:8px">';
    h+='<div class="stat-box"><div class="val" style="color:var(--green)">'+pctExact+'%</div><div class="lbl">Taux de reussite</div></div>';
    h+='<div class="stat-box"><div class="val" style="color:var(--text2)">'+hasard+'%</div><div class="lbl">Hasard (base)</div></div>';
    h+='<div class="stat-box"><div class="val" style="color:var(--green)">'+hist.stats.totalExacts+'</div><div class="lbl">Numeros trouves</div></div>';
    h+='<div class="stat-box"><div class="val">'+hist.stats.totalComparisons+'</div><div class="lbl">Tirages compares</div></div>';
    h+='</div></div>';

    // PAR CATEGORIE
    if(perf&&perf.byCategory&&perf.byCategory.length>0){
      var catNoms={digital:'Digital',matin:'Matin',midi:'Midi',aprem:'Apres-midi',soir:'Soir',afterwork:'Afterwork',weekend:'Weekend'};
      h+='<div class="card"><div class="card-title">Par type de tirage</div>';
      h+='<div class="card-sub">Ou le bot performe le mieux</div>';
      h+='<div style="display:flex;gap:6px;flex-wrap:wrap">';
      for(var i=0;i<perf.byCategory.length;i++){
        var c=perf.byCategory[i];
        var lf=parseFloat(c.lift);
        var lc=lf>=1.15?'var(--green)':lf>=1.05?'var(--orange)':'var(--red)';
        var bg=lf>=1.15?'rgba(0,230,118,.08)':lf>=1.05?'rgba(255,171,64,.08)':'rgba(255,82,82,.08)';
        var pctVsH=((lf-1)*100).toFixed(0);
        h+='<div class="cat-chip" style="background:'+bg+';border:1px solid '+lc+'">';
        h+='<div class="cat-name" style="color:'+lc+'">'+(catNoms[c.category]||c.category)+'</div>';
        h+='<div class="cat-val" style="color:'+lc+'">'+(parseInt(pctVsH)>=0?'+':'')+pctVsH+'%</div>';
        h+='<div class="cat-sub">'+c.hits+' trouves</div>';
        h+='</div>';
      }
      h+='</div></div>';
    }

    // GRAPHIQUE HEBDO
    if(perf&&perf.byWeek&&perf.byWeek.length>1){
      var eR=perf.eRandom||0.278;
      var weeks=perf.byWeek.slice(-12);
      var maxAvg=0,minAvg=999;
      for(var i=0;i<weeks.length;i++){if(weeks[i].avg>maxAvg)maxAvg=weeks[i].avg;if(weeks[i].avg<minAvg)minAvg=weeks[i].avg}
      maxAvg=Math.max(maxAvg,eR*1.5);minAvg=Math.min(minAvg,0);
      var range=maxAvg-minAvg||0.1;
      var W=600,H=180,pL=38,pR=8,pT=16,pB=24;
      var cW=W-pL-pR,cH=H-pT-pB;
      var pts=[];
      for(var i=0;i<weeks.length;i++){
        pts.push({x:pL+i*(cW/(weeks.length-1||1)),y:pT+cH-(weeks[i].avg-minAvg)/range*cH,avg:weeks[i].avg,dt:weeks[i].week.slice(5)});
      }
      var refY=pT+cH-(eR-minAvg)/range*cH;

      h+='<div class="card"><div class="card-title">Evolution semaine par semaine</div>';
      h+='<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:600px;height:auto">';
      for(var i=0;i<=3;i++){var gy=pT+i*cH/3;h+='<line x1="'+pL+'" y1="'+gy+'" x2="'+(W-pR)+'" y2="'+gy+'" stroke="#2d3140" stroke-width="0.5"/>'}
      if(refY>=pT&&refY<=pT+cH) h+='<line x1="'+pL+'" y1="'+refY+'" x2="'+(W-pR)+'" y2="'+refY+'" stroke="#ff5252" stroke-width="0.8" stroke-dasharray="4,3"/>';
      var area='M'+pts[0].x+','+pts[0].y;for(var i=1;i<pts.length;i++)area+=' L'+pts[i].x+','+pts[i].y;
      area+=' L'+pts[pts.length-1].x+','+(pT+cH)+' L'+pts[0].x+','+(pT+cH)+' Z';
      h+='<path d="'+area+'" fill="url(#grd)" opacity="0.3"/>';
      h+='<defs><linearGradient id="grd" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00e676"/><stop offset="100%" stop-color="#00e676" stop-opacity="0"/></linearGradient></defs>';
      h+='<polyline points="'+pts.map(function(p){return p.x+','+p.y}).join(' ')+'" fill="none" stroke="#00e676" stroke-width="2.5" stroke-linejoin="round"/>';
      for(var i=0;i<pts.length;i++){
        var col=pts[i].avg>=eR*1.15?'#00e676':pts[i].avg>=eR?'#ffab40':'#ff5252';
        h+='<circle cx="'+pts[i].x+'" cy="'+pts[i].y+'" r="3.5" fill="'+col+'" stroke="#0f1117" stroke-width="1.5"/>';
        h+='<text x="'+pts[i].x+'" y="'+(pT+cH+14)+'" fill="#9aa0a6" font-size="7" text-anchor="middle">'+pts[i].dt+'</text>';
      }
      h+='</svg></div>';
      h+='<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text2);margin-top:4px">';
      h+='<span><span style="color:#ff5252">---</span> Hasard: '+hasard+'%</span>';
      h+='<span><span style="color:#00e676">&#9679;</span> Bot: '+(perf.avgHits*100/5).toFixed(1)+'%</span>';
      h+='</div></div>';
    }

    // COMPARAISONS RECENTES (5 derniers jours, detail complet)
    if(hist.allAnalyses&&hist.allAnalyses.length>0){
      var recentDays=hist.allAnalyses.slice(-5).reverse();
      h+='<div class="card"><div class="card-title">Derniers resultats</div>';
      h+='<div class="card-sub"><span style="color:var(--green)">&#9679;</span> Gagnant <span style="color:var(--orange)">&#9679;</span> Machine <span style="color:var(--yellow)">&#9679;</span> Proche <span style="color:var(--text2)">&#9679;</span> Manque <span style="color:var(--purple)">&#9679;</span> IA</div>';
      for(var di=0;di<recentDays.length;di++){
        var a=recentDays[di];
        h+='<div style="margin-bottom:10px">';
        h+='<div style="font-weight:700;font-size:12px;color:var(--cyan);margin-bottom:6px;padding:4px 0;border-bottom:2px solid var(--border)">'+a.date+'</div>';
        for(var ci=0;ci<a.comparaisons.length;ci++){
          var c=a.comparaisons[ci];
          if(!c.comp)continue;
          var mach=c.machine||[];
          h+='<div class="cmp-block">';
          h+='<div class="cmp-header"><span class="tirage" style="color:var(--text);font-weight:600">'+c.tirage+'</span></div>';
          // Classique
          h+='<div class="cmp-row"><span class="lbl">Predit</span><div class="nums" style="gap:3px;justify-content:flex-start">';
          for(var ni=0;ni<c.prediction.length;ni++){
            var n=c.prediction[ni];
            var isExact=c.resultat.indexOf(n)>=0;
            var isMachine=!isExact&&mach.indexOf(n)>=0;

function runBacktest(){
  if(btRunning)return;
  var checked=document.querySelectorAll('#bt-tirages input:checked');
  var tirages=[];
  for(var i=0;i<checked.length;i++)tirages.push(checked[i].value);
  var params={
    mise:parseInt(document.getElementById('bt-mise').value),
    mode:document.getElementById('bt-mode').value,
    source:document.getElementById('bt-source').value,
    tirages:tirages
  };
  var pMode=document.getElementById('bt-periode-mode').value;
  if(pMode==='custom'){
    params.dateDebut=document.getElementById('bt-mois-debut').value+'/'+document.getElementById('bt-annee-debut').value;
    params.dateFin=document.getElementById('bt-mois-fin').value+'/'+document.getElementById('bt-annee-fin').value;
  }else{
    params.periode=parseInt(document.getElementById('bt-periode').value);
  }
  var el=document.getElementById('bt-results');
  el.innerHTML='<div class="loading"><div class="spinner"></div><br>Backtest en cours... (peut prendre 1-2 min)</div>';
  btRunning=true;

  fetch('/api/backtest-custom',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)}).then(function(r){return r.json()}).then(function(data){
    btRunning=false;
    if(data.error){el.innerHTML='<div class="card" style="color:var(--red)">Erreur: '+data.error+'</div>';return}
    renderBtResults(data);
  }).catch(function(e){btRunning=false;el.innerHTML='<div class="card" style="color:var(--red)">Erreur connexion</div>'});
}

        for(var ni=0;ni<w.botNums.length;ni++){
          var n=w.botNums[ni];var ex=rSet.has(n);var ma=!ex&&mSet.has(n);
          h+=Ns(n,ex?'n-hit ns':ma?'n-ora ns':'n-miss ns');
        }
        h+='</div><span style="font-size:10px;color:var(--green);font-weight:700">'+(w.botHits||0)+'g</span>';
        if(w.botGain>0)h+='<span style="font-size:9px;color:var(--green);margin-left:4px">+'+w.botGain.toLocaleString()+'F</span>';
        h+='</div>';
      }
      // IA prediction
      if(w.iaNums&&w.iaNums.length>0){
        h+='<div class="cmp-row"><span class="lbl" style="color:var(--purple)">IA</span><div class="nums" style="gap:3px;justify-content:flex-start">';
        for(var ni=0;ni<w.iaNums.length;ni++){
          var n=w.iaNums[ni];var ex=rSet.has(n);var ma=!ex&&mSet.has(n);
          h+=Ns(n,ex?'n-hit ns':ma?'n-ora ns':'n-miss ns');
        }
        h+='</div><span style="font-size:10px;color:var(--purple);font-weight:700">'+(w.iaHits||0)+'g</span>';
        if(w.iaGain>0)h+='<span style="font-size:9px;color:var(--purple);margin-left:4px">+'+w.iaGain.toLocaleString()+'F</span>';
        h+='</div>';
      }
      // LSTM prediction
      if(w.lstmNums&&w.lstmNums.length>0){
        h+='<div class="cmp-row"><span class="lbl" style="color:var(--orange)">LSTM</span><div class="nums" style="gap:3px;justify-content:flex-start">';
        for(var ni=0;ni<w.lstmNums.length;ni++){
          var n=w.lstmNums[ni];var ex=rSet.has(n);var ma=!ex&&mSet.has(n);
          h+=Ns(n,ex?'n-hit ns':ma?'n-ora ns':'n-miss ns');
        }
        h+='</div><span style="font-size:10px;color:var(--orange);font-weight:700">'+(w.lstmHits||0)+'g</span>';
        if(w.lstmGain>0)h+='<span style="font-size:9px;color:var(--orange);margin-left:4px">+'+w.lstmGain.toLocaleString()+'F</span>';
        h+='</div>';
      }
      // Resultat: gagnants | machine (UP | DOWN)
      h+='<div class="cmp-row"><span class="lbl">Sorti</span><div class="nums" style="gap:3px;justify-content:flex-start">';
      for(var ni=0;ni<w.resultat.length;ni++) h+=Ns(w.resultat[ni],'n-grn ns');
      if(w.machine&&w.machine.length>0){
        h+='<span style="color:var(--text2);font-size:9px;margin:0 3px">|</span>';
        for(var ni=0;ni<w.machine.length;ni++) h+=Ns(w.machine[ni],'n-ora ns');
      }
      h+='</div></div>';
      h+='</div>';
    }
    h+='</div>';
  }

  el.innerHTML=h;
}

function runTrainLearn(){
  if(btRunning)return;
  btRunning=true;
  var el=document.getElementById('bt-results');
  el.innerHTML='<div class="loading"><div class="spinner"></div><br>Apprentissage en cours... (2-3 min)</div>';
  fetch('/api/train-learn',{method:'POST',headers:{'Content-Type':'application/json'}}).then(function(r){return r.json()}).then(function(data){
    btRunning=false;
    if(data.error){el.innerHTML='<div class="card" style="color:var(--red)">'+data.error+'</div>';return}
    var h='<div class="card" style="border-color:var(--green)">';
    h+='<div class="card-title" style="color:var(--green)">Apprentissage termine</div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">';
    h+='<div class="stat-box"><div class="val" style="color:var(--text2)">'+data.scoreBefore+'%</div><div class="lbl">Avant</div></div>';
    h+='<div class="stat-box"><div class="val" style="font-size:24px">&#8594;</div><div class="lbl"></div></div>';
    h+='<div class="stat-box"><div class="val" style="color:var(--green)">'+data.scoreAfter+'%</div><div class="lbl">Apres</div></div>';
    h+='<div class="stat-box"><div class="val" style="color:'+(data.delta>=0?'var(--green)':'var(--red)')+'">'+
      (data.delta>=0?'+':'')+data.delta+'%</div><div class="lbl">Delta</div></div>';
    h+='</div>';
    h+='<div style="font-size:11px;color:var(--text2)">Entraine sur '+data.trainedOn.toLocaleString()+' tirages | '+data.categories+' categories</div>';
    h+='<div style="margin-top:10px"><div style="font-size:11px;color:var(--cyan);font-weight:700;margin-bottom:6px">Poids appris</div>';
    var sorted=Object.entries(data.weights).sort(function(a,b){return b[1]-a[1]});
    var maxW=sorted[0]?sorted[0][1]:1;
    for(var i=0;i<sorted.length;i++){
      var k=sorted[i][0],v=sorted[i][1];
      var pct=(v/maxW*100).toFixed(0);
      var col=v>=15?'var(--green)':v>=5?'var(--orange)':'var(--text2)';
      h+='<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px">';
      h+='<span style="min-width:100px;color:var(--text2)">'+k+'</span>';
      h+='<div style="flex:1;height:5px;background:var(--card2);border-radius:3px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+col+'"></div></div>';
      h+='<span style="min-width:35px;text-align:right;font-weight:700;color:'+col+'">'+v.toFixed(1)+'</span>';
      h+='</div>';
    }
    h+='</div></div>';
    el.innerHTML=h;
    showToast('Bot entraine avec succes');
  }).catch(function(){btRunning=false;el.innerHTML='<div class="card" style="color:var(--red)">Erreur</div>'});
}

function runTrainNN(){
  if(btRunning)return;
  if(!confirm('Re-entrainer le reseau de neurones ? (prend ~30s)'))return;
  btRunning=true;
  var el=document.getElementById('bt-results');
  el.innerHTML='<div class="loading"><div class="spinner"></div><br>Entrainement IA en cours...</div>';
  fetch('/api/train-nn',{method:'POST'}).then(function(r){return r.json()}).then(function(data){
    btRunning=false;
    if(data.success){
      el.innerHTML='<div class="card" style="border-color:var(--purple)"><div class="card-title" style="color:var(--purple)">IA re-entrainee</div><div style="font-size:12px">'+data.message+'</div></div>';
      showToast('IA entrainee avec succes');
    }else{
      el.innerHTML='<div class="card" style="color:var(--red)">Erreur: '+data.error+'</div>';
    }
  }).catch(function(){btRunning=false;el.innerHTML='<div class="card" style="color:var(--red)">Erreur connexion</div>'});
}

// ═══ SIDEBAR ═══
function loadSidebar(){
  var el=document.getElementById('sidContent');
  fetch('/api/resultats-jour').then(function(r){return r.json()}).then(function(data){
    document.getElementById('sidDate').textContent=data.date+' '+String.fromCharCode(8212)+' '+data.jourNom;
    if(!data.tirages||data.tirages.length===0){el.innerHTML='<div class="sid-empty">Aucun resultat encore</div>';return}
    var h='<div class="sid-count"><b>'+data.tirages.length+'</b> tirages sortis</div>';
    for(var i=0;i<data.tirages.length;i++){
      var d=data.tirages[i];
      h+='<div class="sid-draw"><div class="sid-draw-name"><span class="h">'+(data.horaires[d.type]||'')+'</span>'+d.type+'</div>';
      h+='<div class="sid-nums">';
      for(var j=0;j<d.gagnants.length;j++) h+='<div class="sid-n sid-g">'+String(d.gagnants[j]).padStart(2,'0')+'</div>';
      if(d.machine&&d.machine.length>0){
        h+='<span style="color:var(--text2);font-size:8px;margin:0 2px">|</span>';
        for(var j=0;j<d.machine.length;j++) h+='<div class="sid-n sid-m">'+String(d.machine[j]).padStart(2,'0')+'</div>';
      }
      h+='</div></div>';
    }
    el.innerHTML=h;
  }).catch(function(){el.innerHTML='<div class="sid-empty">Erreur</div>'});
}

loadStatus();
loadSidebar();
try{loadJouer(currentJour)}catch(e){}
