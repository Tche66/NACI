name: Auto-update LONACI data

on:
  schedule:
    # Apres les groupes de tirages principaux (heures UTC)
    # CI = UTC+0, donc 10:30 CI = 10:30 UTC
    - cron: '30 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest results
        run: node update.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet lonaci_db.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lonaci_db.json
          git commit -m "chore: auto-update resultats $(date +%Y-%m-%d_%H:%M)"
          git push
